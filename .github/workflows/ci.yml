name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm ci --prefix remote-worker
      - name: Verify Windows functionality
        if: runner.os == 'Windows'
        run: npm run verify
      - name: Verify Linux including root identity and symlink boundaries
        if: runner.os == 'Linux'
        run: sudo env "PATH=$PATH" REQUIRE_SYMLINK_TESTS=1 npm run verify
      - name: Validate example deployment configuration
        if: runner.os == 'Linux'
        run: cp .env.example .env && docker compose config --quiet
